name: CI

# Run automated checks on every push and pull request so broken
# changes are caught before they reach the deployed app.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    # Throwaway MongoDB for the tests to run against (clean each run)
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run backend tests
        working-directory: backend
        env:
          # Points at the throwaway MongoDB service above (full permissions)
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/smartgrocery_test
          # Test-only secret — not a real credential
          JWT_SECRET: ci_test_secret
        run: npm test
