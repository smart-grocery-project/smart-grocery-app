services:
mongodb:
  image: mongo:8
  container_name: smartgrocery-mongodb
  ports:
    - "27017:27017"
  volumes:
    - mongo-data:/data/db
  restart: unless-stopped

backend:
build: ./backend
container_name: smartgrocery-backend
ports:
- "5000:5000"
env_file:
- ./backend/.env
depends_on:
- mongodb

frontend:
build: ./frontend
container_name: smartgrocery-frontend
ports:
- "8081:8081"
env_file:
- ./frontend/.env
depends_on:
- backend

volumes:
mongo-data:

